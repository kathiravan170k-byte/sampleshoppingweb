<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/shopmartlogo.jpg" type="image/x-icon">
    <title>Contact Us</title>
</head>
<body>
    <header>
        <center><h1>Contact Us</h1></center>
    </header>
    <main>
        <form action="http://example.com/submit-form" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="eg. John Doe" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="eg. john.doe@example.com" required>
            <br><br>
            <label for="phonenum">Phone Number:</label>
            <input type="tel" id="phonenum" name="phonenum" placeholder="eg. 9876543210" required  pattern="[0-9]{2}[0-9]{10}">
            <br><br>
            <label for="DOB">Date of Birth:</label>
            <input type="date" id="DOB" name="DOB" required>
            <br><br>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <br><br>
            <label for="address">Address:</label>
            <textarea id="address" name="address" placeholder="eg. 123 Main Street, City, State" required></textarea>
            <br><br>
            <label for="issue">your issue and opinion:</label>
            <textarea id="issue" name="issue" placeholder="Your issue here..." required></textarea>
            <br><br>
            <label for="agree">
                <input type="checkbox" id="agree" name="agree" required>
                I agree to the <a href="T&C.html" target="_blank">terms and conditions</a>.
            </label>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
